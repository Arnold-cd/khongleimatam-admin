name: Deploy Admin to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Inject Secrets into index.html
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          node -e '
            const fs = require("fs");
            let content = fs.readFileSync("index.html", "utf8");
            const url = process.env.SUPABASE_URL || "";
            const key = process.env.SUPABASE_ANON_KEY || "";
            if (!url || !key) {
              console.error("ERROR: Secrets SUPABASE_URL or SUPABASE_ANON_KEY are missing!");
              process.exit(1);
            }
            content = content.replace("__SUPABASE_URL__", url);
            content = content.replace("__SUPABASE_ANON_KEY__", key);
            fs.writeFileSync("index.html", content, "utf8");
            console.log("Successfully injected Supabase secrets!");
          '

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
